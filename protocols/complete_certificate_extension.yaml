cascade:
  - "Audit Bundle with one optimized root charge bound."
  - "If open, call global MILP and audit its returned plan with the same root charge bound."
  - "If an LP integrality gap remains, recursively branch on the undecided natural-LP variable closest to 0.5, breaking ties lexicographically, and close every leaf with a quantized charge bound."
branch_semantics: "Each include/exclude branch partitions all feasible plans consistent with the path; a leaf is closed when floor(constant completed value plus residual charge upper bound) is no larger than the incumbent."
